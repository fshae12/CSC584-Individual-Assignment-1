<html>
    <head>
        <title>Personal Profile Information</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styleProfile.css">
    </head>
    <body>
        <div class="container">
            <h1>My Personal Profile</h1>
            <p class="subtitle">
            Fill in the details.
            </p>
            <form action="PersonalProfileServlet" method="post">
                <label> Name: </label>
                <input type="text" name="name"> <br>
                
                <label> Student ID: </label>
                <input type="text" name="studentId"> <br>
                
                <label> Programme: </label>
                <input type="text" name="programme"> <br>
                
                <label> Email: </label>
                <input type="text" name="email"> <br>
                
                <label> Hobbies: </label>
                <input type="text" name="hobbies"> <br>
                
                <label> Short Self-Introduction: </label>
                <textarea name="shortIntro"></textarea> <br>

                <button type="submit">Done</button>
            </form>
        </div>
    </body>
</html>
